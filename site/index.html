<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GTech City</title>
    <style>
      :root {
        --ink: #23302a;
        --paper: #fbf6ee;
        --card: #ffffffee;
        --line: #d9d2c4;
        --accent: #2b3a30;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--paper);
        color: var(--ink);
        font:
          14px/1.45 ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      canvas {
        display: block;
      }
      #bar {
        position: fixed;
        top: 12px;
        left: 12px;
        right: 12px;
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        pointer-events: none;
      }
      #bar > * {
        pointer-events: auto;
      }
      #bar h1 {
        margin: 0 8px 0 0;
        font-size: 18px;
        font-weight: 800;
        letter-spacing: -0.01em;
      }
      button {
        font: inherit;
        color: var(--ink);
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 6px 14px;
        cursor: pointer;
      }
      button[aria-pressed="true"] {
        background: var(--accent);
        color: #fdf3b0;
        border-color: var(--accent);
      }
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      #card {
        position: fixed;
        top: 60px;
        right: 12px;
        width: min(340px, calc(100vw - 24px));
        max-height: calc(100vh - 110px);
        overflow: auto;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 14px 16px;
      }
      #card[hidden] {
        display: none;
      }
      #card h2 {
        margin: 0 0 2px;
        font-size: 16px;
      }
      #card .sub {
        color: #5d6a62;
        margin: 0 0 10px;
        font-size: 12px;
      }
      #card p {
        margin: 0 0 10px;
      }
      .facts {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
        margin-bottom: 10px;
      }
      .facts div {
        background: #f1ece1;
        border-radius: 8px;
        padding: 6px 8px;
      }
      .facts b {
        display: block;
        font-size: 15px;
      }
      .facts span {
        font-size: 11px;
        color: #5d6a62;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin-bottom: 10px;
      }
      .chips span {
        background: #e6eedf;
        border-radius: 999px;
        padding: 2px 8px;
        font-size: 11px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
      }
      td,
      th {
        text-align: left;
        padding: 3px 0;
        border-bottom: 1px solid #eee7da;
      }
      td.n,
      th.n {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      tr.on td {
        font-weight: 700;
      }
      tr[data-floor] {
        cursor: pointer;
      }
      .sw {
        display: inline-block;
        width: 9px;
        height: 9px;
        border-radius: 2px;
        margin-right: 6px;
      }
      #hint {
        position: fixed;
        left: 12px;
        bottom: 12px;
        font-size: 12px;
        color: #5d6a62;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 6px 10px;
        max-width: calc(100vw - 24px);
      }
    </style>
  </head>
  <body>
    <div id="bar">
      <h1>GTech City</h1>
      <span id="districts"></span>
      <button id="staffing">Staffing</button>
      <button id="explode" aria-pressed="false">Explode</button>
      <button id="wiring" aria-pressed="true">Wiring</button>
    </div>
    <aside id="card" hidden aria-live="polite"></aside>
    <div id="hint">
      A district is a repository. A building is one app or package, a floor one
      module, as tall as its file count. Drag to orbit, scroll to zoom, click a
      floor.
    </div>
    <script src="vendor/three.min.js"></script>
    <script src="vendor/OrbitControls.js"></script>
    <script src="districts/index.js"></script>
    <script>
      // Each district is a script of its own, so the page opens from a file with no server.
      (window.GTECH_DISTRICT_IDS || []).forEach(function (id) {
        document.write('<script src="districts/' + id + '.js"><\/script>');
      });
    </script>
    <script src="catalogue.js"></script>
    <script src="dummy.js"></script>
    <!-- Written by tools/analyze.mjs; the page works without it. -->
    <script src="analysis.js"></script>
    <script src="people.js"></script>
    <script src="city.js"></script>
  </body>
</html>
